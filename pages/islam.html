        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Quicksand', sans-serif;
            background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
            min-height: 100vh;
            color: #2d3436;
        }
        .container { max-width: 1200px; margin: 0 auto; padding: 0 20px; }
        
        .subject-header {
            background: linear-gradient(135deg, #6C63FF 0%, #5A52D5 100%);
            padding: 30px 20px;
            border-radius: 0 0 30px 30px;
            color: white;
            text-align: center;
            margin-bottom: 30px;
            box-shadow: 0 10px 40px rgba(108,99,255,0.3);
        }
        .subject-header h1 { font-size: 2.5rem; margin-bottom: 5px; }
        .subject-header .subtitle { font-size: 1.1rem; opacity: 0.9; }
        .subject-header .date-info {
            background: rgba(255,255,255,0.2);
            padding: 8px 20px;
            border-radius: 20px;
            display: inline-block;
            margin-top: 10px;
            font-weight: 600;
        }
        .back-home {
            display: inline-block;
            color: white;
            text-decoration: none;
            background: rgba(255,255,255,0.2);
            padding: 8px 20px;
            border-radius: 20px;
            margin-bottom: 10px;
            transition: all 0.3s;
        }
        .back-home:hover { background: rgba(255,255,255,0.3); transform: translateX(-3px); }
        
        .lesson-container {
            background: white;
            border-radius: 20px;
            padding: 30px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.08);
            margin-bottom: 20px;
            min-height: 300px;
        }
        .lesson-container .day-badge {
            display: inline-block;
            background: #6C63FF;
            color: white;
            padding: 5px 15px;
            border-radius: 20px;
            font-size: 0.85rem;
            font-weight: 600;
            margin-bottom: 15px;
        }
        .lesson-container .lesson-content h3 {
            color: #6C63FF;
            font-size: 1.5rem;
            margin-bottom: 15px;
        }
        .lesson-container .lesson-content ul {
            list-style: none;
            padding: 0;
        }
        .lesson-container .lesson-content ul li {
            padding: 10px 15px;
            margin-bottom: 8px;
            background: #f8f9fa;
            border-radius: 12px;
            border-left: 4px solid #6C63FF;
        }
        .lesson-container .lesson-content .lesson-tip {
            background: #fff3cd;
            padding: 15px 20px;
            border-radius: 12px;
            margin-top: 15px;
            border-left: 4px solid #ffc107;
        }

            background: #f0f0f0;
            padding: 20px;
            border-radius: 12px;
            text-align: center;
            font-size: 1.4rem;
            margin: 15px 0;
            direction: rtl;
            font-family: 'Arial', sans-serif;
        }

            display: block;
            font-size: 1rem;
            direction: ltr;
            color: #666;
            margin-top: 5px;
        }
        
        .navigation-buttons {
            display: flex;
            justify-content: space-between;
            gap: 15px;
            margin: 20px 0;
            flex-wrap: wrap;
        }
        .navigation-buttons button {
            padding: 12px 30px;
            border: none;
            border-radius: 15px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
            font-family: 'Quicksand', sans-serif;
            flex: 1;
            min-width: 120px;
        }
        .btn-prev { background: #ecf0f1; color: #2d3436; }
        .btn-prev:hover:not(:disabled) { background: #d5d8da; transform: translateX(-3px); }
        .btn-next { background: #6C63FF; color: white; }
        .btn-next:hover:not(:disabled) { background: #5A52D5; transform: translateX(3px); box-shadow: 0 5px 20px rgba(108,99,255,0.3); }
        .btn-next:disabled, .btn-prev:disabled { opacity: 0.5; cursor: not-allowed; transform: none !important; }
        
        .quiz-container {
            background: white;
            border-radius: 20px;
            padding: 30px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.08);
            margin-top: 20px;
            display: none;
        }

        .quiz-container h3 { color: #6C63FF; font-size: 1.5rem; margin-bottom: 20px; }
        
        .question {
            margin-bottom: 25px;
            padding: 20px;
            background: #f8f9fa;
            border-radius: 12px;
        }
        .question p { font-weight: 600; margin-bottom: 10px; font-size: 1.05rem; }
        .options { display: flex; flex-direction: column; gap: 8px; }
        .options label {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 10px 15px;
            background: white;
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.2s;
            border: 2px solid transparent;
        }
        .options label:hover { border-color: #8B83FF; background: #f0edff; }
        .options input[type="radio"] { width: 18px; height: 18px; accent-color: #6C63FF; }
        
        .btn-submit {
            background: #6BCB77;
            color: white;
            padding: 12px 40px;
            border: none;
            border-radius: 15px;
            font-size: 1.1rem;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.3s;
            font-family: 'Quicksand', sans-serif;
        }
        .btn-submit:hover { transform: scale(1.03); box-shadow: 0 5px 20px rgba(107,203,119,0.3); }
        
        .quiz-result {
            padding: 20px;
            border-radius: 12px;
            margin-top: 20px;
            text-align: center;
            font-weight: 700;
            font-size: 1.2rem;
            display: none;
        }
        .quiz-result.success { display: block; background: #d4edda; color: #155724; border: 2px solid #6BCB77; }
        .quiz-result.fail { display: block; background: #f8d7da; color: #721c24; border: 2px solid #FF6B6B; }
        
        .progress-bar-container {
            background: #ecf0f1;
            border-radius: 15px;
            height: 12px;
            margin: 20px 0;
            overflow: hidden;
        }
        .progress-bar-fill {
            height: 100%;
            border-radius: 15px;
            background: linear-gradient(90deg, #8B83FF, #6C63FF);
            transition: width 0.8s cubic-bezier(0.4, 0, 0.2, 1);
            width: 0%;
        }
        
        .week-progress {
            display: flex;
            justify-content: space-between;
            gap: 8px;
            margin: 20px 0;
        }
        .week-day {
            flex: 1;
            text-align: center;
            padding: 8px 4px;
            border-radius: 10px;
            font-size: 0.75rem;
            font-weight: 600;
            background: #ecf0f1;
            color: #999;
            transition: all 0.3s;
        }
        .week-day.completed { background: #d4edda; color: #155724; }
        .week-day.current { background: #6C63FF; color: white; }
        .week-day.locked { background: #f8d7da; color: #721c24; }
        
        .message-box {
            text-align: center;
            padding: 30px;
            background: #f8f9fa;
            border-radius: 15px;
            margin: 20px 0;
        }
        .message-box .big-emoji { font-size: 4rem; }
        .message-box h3 { font-size: 1.5rem; color: #6C63FF; margin: 15px 0; }
        .message-box p { color: #636e72; font-size: 1.1rem; }
        
        footer {
            background: #2d3436;
            color: rgba(255,255,255,0.8);
            padding: 30px 20px;
            text-align: center;
            border-top-left-radius: 30px;
            border-top-right-radius: 30px;
            margin-top: 20px;
        }

        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(30px); }

</head>

                            { question: "Le Ramadan est quel mois ?", options: ["7ème", "8ème", "9ème", "10ème"], correct: 2 },
                            { question: "Qui est le dernier prophète ?", options: ["Ibrahim", "Musa", "Muhammad", "Isa"], correct: 2 },
                            { question: "La Zakat est le combien de pilier ?", options: ["1er", "2ème", "3ème", "4ème"], correct: 2 },
                            { question: "Combien de rak'ahs a Maghrib ?", options: ["2", "3", "4", "5"], correct: 1 },
                            { question: "Que signifie 'Muhammadan rasulu Allah' ?", options: ["Muhammad est aimé", "Muhammad est le messager", "Muhammad est le fils", "Muhammad est un prophète"], correct: 1 },
                            { question: "Les 5 piliers sont-ils importants ?", options: ["Oui", "Non", "Parfois", "Seulement pour les hommes"], correct: 0 }
                        ]
                    }
                }
            }
        };

        // ============================================ //
        // LOGIQUE DE LA PAGE //
        // ============================================ //

        const TOTAL_DAYS = 7;
        const START_DATE = new Date('2026-07-14');
        const TODAY = new Date();

        function getCurrentDay() {
            const start = new Date(START_DATE.getFullYear(), START_DATE.getMonth(), START_DATE.getDate());
            const today = new Date(TODAY.getFullYear(), TODAY.getMonth(), TODAY.getDate());
            const diffDays = Math.floor((today - start) / (1000 * 60 * 60 * 24));
            if (diffDays < 0) return 1;
            if (diffDays >= TOTAL_DAYS) return TOTAL_DAYS;
            return diffDays + 1;
        }

        function getTodayDate() {
            const options = { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' };
            return TODAY.toLocaleDateString('fr-FR', options);
        }

        function getDateForDay(dayNumber) {
            const date = new Date(START_DATE);
            date.setDate(date.getDate() + dayNumber - 1);
            return date;
        }

        function formatDate(date) {
            const options = { day: 'numeric', month: 'long', year: 'numeric' };
            return date.toLocaleDateString('fr-FR', options);
        }

        // Progress
        function getProgress() {
            try {
                const data = localStorage.getItem('monEcoleProgress');
                return data ? JSON.parse(data) : {};
            } catch { return {}; }
        }

        function saveProgress(progress) {
            localStorage.setItem('monEcoleProgress', JSON.stringify(progress));
        }

        function getSubjectProgress() {
            const progress = getProgress();
            return progress.islam || { completedDays: [], scores: {} };
        }

        function updateSubjectProgress(dayNumber, score) {
            const progress = getProgress();
            if (!progress.islam) progress.islam = { completedDays: [], scores: {} };
            if (!progress.islam.completedDays.includes(dayNumber)) {
                progress.islam.completedDays.push(dayNumber);
            }
            progress.islam.scores[dayNumber] = score;
            saveProgress(progress);
            return progress.islam;
        }

        function isDayCompleted(dayNumber) {
            const progress = getSubjectProgress();
            return progress.completedDays.includes(dayNumber);
        }

        function isDayUnlocked(dayNumber) {
            return dayNumber <= getCurrentDay();
        }

        // ============================================ //
        // RENDER //
        // ============================================ //

        let currentViewDay = getCurrentDay();

        function renderLesson(dayNumber) {
            const container = document.getElementById('lessonContainer');
            const dayData = SUBJECT_DATA.days[dayNumber];
            
            if (!dayData) {
                container.innerHTML = `
                    <div class="message-box">
                        <div class="big-emoji">📚</div>
                        <h3>Leçon à venir</h3>
                        <p>Reviens bientôt pour découvrir cette leçon !</p>
                    </div>
                `;
                return;
            }

            const completed = isDayCompleted(dayNumber);
            const unlocked = isDayUnlocked(dayNumber);
            const date = getDateForDay(dayNumber);
            
            let statusBadge = '';
            if (completed) statusBadge = '✅ Terminé';
            else if (unlocked) statusBadge = '🔵 À faire';
            else statusBadge = '🔒 Verrouillé';

            container.innerHTML = `
                <div class="day-badge">📅 Jour ${dayNumber} - ${formatDate(date)}</div>
                <div class="lesson-content">
                    ${dayData.content}
                    <div style="margin-top: 15px; font-size: 0.9rem; color: #636e72;">
                        Statut: <strong>${statusBadge}</strong>
                    </div>
                </div>
            `;

            const quizContainer = document.getElementById('quizContainer');
            if (unlocked) {
                quizContainer.classList.add('active');
                renderQuiz(dayNumber);
            } else {
                quizContainer.classList.remove('active');
            }

            document.getElementById('prevDay').disabled = (dayNumber <= 1);
            document.getElementById('nextDay').disabled = (dayNumber >= TOTAL_DAYS);
        }

        function renderQuiz(dayNumber) {
            const container = document.getElementById('quizContainer');
            const dayData = SUBJECT_DATA.days[dayNumber];
            
            if (!dayData || !dayData.quiz) {
                container.innerHTML = `<p>Aucun quiz pour cette leçon.</p>`;
                return;
            }

            const quiz = dayData.quiz;
            const completed = isDayCompleted(dayNumber);

            if (completed) {
                const progress = getSubjectProgress();
                const score = progress.scores[dayNumber] || 0;
                container.innerHTML = `
                    <h3>✅ Quiz terminé !</h3>
                    <div class="quiz-result success" style="display:block;">
                        🎉 Score: ${score}% - Bravo !
                    </div>
                    <p style="text-align:center; color:#636e72; margin-top:10px;">
                        Tu peux réviser la leçon quand tu veux.
                    </p>
                `;
                return;
            }

            let html = `<h3>📝 Quiz du Jour ${dayNumber}</h3>`;
            html += `<p>Réponds aux ${quiz.questions.length} questions ci-dessous :</p>`;

            quiz.questions.forEach((q, index) => {
                html += `
                    <div class="question" data-q="${index}">
                        <p>${index + 1}. ${q.question}</p>
                        <div class="options">
                            ${q.options.map((opt, i) => `
                                <label>
                                    <input type="radio" name="q${index}" value="${i}">
                                    ${opt}
                                </label>
                            `).join('')}
                        </div>
                    </div>
                `;
            });

            html += `
                <button class="btn-submit" onclick="submitQuiz(${dayNumber})">✅ Vérifier mes réponses</button>
                <div id="quizResult" class="quiz-result"></div>
            `;

            container.innerHTML = html;
        }

        window.submitQuiz = function(dayNumber) {
            const dayData = SUBJECT_DATA.days[dayNumber];
            if (!dayData || !dayData.quiz) return;

            const quiz = dayData.quiz;
            let correct = 0;
            const total = quiz.questions.length;

            quiz.questions.forEach((q, index) => {
                const selected = document.querySelector(`input[name="q${index}"]:checked`);
                if (selected && parseInt(selected.value) === q.correct) {
                    correct++;
                }
            });

            const score = Math.round((correct / total) * 100);
            const resultDiv = document.getElementById('quizResult');
            
            if (score >= 65) {
                resultDiv.className = 'quiz-result success';
                resultDiv.textContent = `🎉 Félicitations ! ${score}% - Quiz réussi !`;
                updateSubjectProgress(dayNumber, score);
                setTimeout(() => renderLesson(dayNumber), 1500);
            } else {
                resultDiv.className = 'quiz-result fail';
                resultDiv.textContent = `📚 ${score}% - Réessaie ! Relis la leçon et retente ta chance.`;
            }
        };

        function renderWeekProgress() {
            const container = document.getElementById('weekProgress');
            let html = '';

            for (let i = 1; i <= TOTAL_DAYS; i++) {
                const completed = isDayCompleted(i);
                const unlocked = isDayUnlocked(i);
                
                let className = 'week-day';
                if (completed) className += ' completed';
                else if (unlocked) className += ' current';
                else className += ' locked';

                const label = completed ? '✅' : (unlocked ? '📖' : '🔒');
                html += `<div class="${className}">${label} J${i}</div>`;
            }

            container.innerHTML = html;
        }

        function updateProgressBar() {
            const progress = getSubjectProgress();
            const completed = progress.completedDays ? progress.completedDays.length : 0;
            const percent = Math.round((completed / TOTAL_DAYS) * 100);
            document.getElementById('subjectProgress').style.width = `${percent}%`;
        }

        function navigateToDay(direction) {
            const newDay = currentViewDay + direction;
            if (newDay < 1 || newDay > TOTAL_DAYS) return;
            currentViewDay = newDay;
            renderLesson(currentViewDay);
            document.getElementById('prevDay').disabled = (currentViewDay <= 1);
            document.getElementById('nextDay').disabled = (currentViewDay >= TOTAL_DAYS);
        }

        // ============================================ //
        // INITIALISATION //
        // ============================================ //

        document.addEventListener('DOMContentLoaded', function() {
            document.getElementById('current-date').textContent = '📅 ' + getTodayDate();
            
            renderLesson(currentViewDay);
            renderWeekProgress();
            updateProgressBar();
            
            document.getElementById('prevDay').disabled = (currentViewDay <= 1);
            document.getElementById('nextDay').disabled = (currentViewDay >= TOTAL_DAYS);

            document.getElementById('prevDay').addEventListener('click', function() { navigateToDay(-1); });
            document.getElementById('nextDay').addEventListener('click', function() { navigateToDay(1); });

            // Vérifier si on est avant le début
            if (TODAY < START_DATE) {
                document.getElementById('lessonContainer').innerHTML = `
                    <div class="message-box">
                        <div class="big-emoji">⏳</div>
                        <h3>Les cours commencent le 14 juillet !</h3>
                        <p>Reviens le 14 juillet pour commencer l'aventure ! 🌟</p>
                    </div>
                `;
                document.getElementById('quizContainer').classList.remove('active');
            }

            console.log('✅ Page Islam chargée avec succès !');
            console.log('📅 Aujourd\'hui:', getTodayDate());
            console.log('📚 Jour actuel:', currentViewDay);
        });
    </script>
</body>
</html>
